<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сантехнік / Plumbing / Santechnikas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- Шапка сайта -->
  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <!-- Аватарка мастеров (второе фото) -->
      <img src="avatar.jpg" alt="Аватар майстра" class="w-12 h-12 rounded-full object-cover border-2 border-cyan-400 shadow-md">
      <div>
        <h1 class="text-xl font-bold text-cyan-400 leading-tight">PlumbMaster</h1>
        <a href="tel:+37066159955" class="text-xs text-slate-300 hover:text-cyan-400">📞 +370 661 59955</a>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Выбор языка -->
      <select id="langSelect" class="bg-slate-800 text-white px-2 py-1 rounded text-sm border border-slate-700">
        <option value="en">EN</option>
        <option value="uk">UK</option>
        <option value="lt">LT</option>
      </select>

      <!-- Кнопка входа Google для 2 мастеров -->
      <button id="googleAuthBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1 rounded text-sm transition">
        Вхід (Майстер)
      </button>
    </div>
  </header>

  <!-- Блок с фоновым изображением (первое фото — проект) -->
  <section class="relative bg-slate-900 text-white py-16 px-6 text-center bg-cover bg-center" style="background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('background.jpg');">
    <div class="max-w-3xl mx-auto relative z-10">
      <h2 id="heroTitle" class="text-3xl md:text-4xl font-extrabold mb-3 text-cyan-400">Професійні сантехнічні послуги</h2>
      <p id="heroSubtitle" class="text-slate-200 text-base md:text-lg mb-6">Проектування, монтаж систем опалення, водопостачання та якісний ремонт</p>
      
      <div class="flex flex-wrap justify-center gap-4">
        <a href="tel:+37066159955" class="bg-cyan-500 hover:bg-cyan-400 text-white font-bold px-6 py-3 rounded-lg shadow-lg flex items-center gap-2 transition transform hover:scale-105">
          📞 Зателефонувати
        </a>
        <a href="https://wa.me/37066159955" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-lg shadow-lg flex items-center gap-2 transition transform hover:scale-105">
          💬 WhatsApp
        </a>
      </div>
    </div>
  </section>

  <!-- Список услуг -->
  <main class="max-w-6xl mx-auto p-4 md:p-8">
    <div id="adminBadge" class="hidden mb-6 p-3 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-lg text-sm font-medium text-center">
      <!-- Показываем статус вошедшего мастера -->
    </div>

    <h2 class="text-2xl font-bold mb-6 text-center text-slate-900" id="mainTitle">Наші послуги та ціни</h2>
    <div id="servicesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Услуги подгружаются автоматически -->
    </div>
  </main>

  <!-- ВСПЛЫВАЮЩЕЕ ОКНО ДЛЯ ПРОСМОТРА ФОТО НА ВЕСЬ ЭКРАН -->
  <div id="imageViewerModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 cursor-pointer">
    <button id="closeViewerBtn" class="absolute top-4 right-4 text-white text-3xl font-bold bg-slate-800/80 w-10 h-10 rounded-full flex items-center justify-center">&times;</button>
    <img id="fullSizeImage" src="" alt="Детали работы" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl">
  </div>

  <!-- Подключаем главный скрипт -->
  <script type="module" src="app.js"></script>
</body>
</html>
